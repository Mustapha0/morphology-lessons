/* ---------- Table 12.1 ---------- */
const FEAT=[
 ['number',['singular','plural','dual']],['case',['nominative','accusative','dative']],['person',['3rd','1st/2nd']],
 ['degree',['positive','comparative','superlative']],['voice',['active','passive']],['mood',['indicative','subjunctive']],

function featWidget(box){
  const chips=el('div','chips'),host=el('div','stage'),res=el('div','res');box.append(chips,host,res);const st=new Stage(host);
  const KS=['stem','aff','mod'];
  FEAT.forEach(([f,vals])=>{const c=el('button','chip',f);
    c.onclick=()=>{[...chips.children].forEach(x=>x.classList.remove('on'));c.classList.add('on','done');
      const tiles=[];vals.forEach((v,i)=>{if(i)tiles.push(tl('g'+i,'>','op',.7));tiles.push(tl('v'+i,v,KS[i],Math.max(2.6,wd(v)*.9)));});
      st.set(S(R(tiles,'from most to least frequent')));
      res.innerHTML=`<b>${f}</b>: ${vals.join(' > ')}. This is the overall pattern of a language, not a claim about every word.`;};
    chips.append(c);});
  chips.children[0].click();
}

/* ---------- Shortness: endings as tile widths ---------- */

  a:S(R([tl('s',stem,'stem',wd(stem))],sub||'stem')),
  b:S(R([tl('s',stem,'stem',wd(stem)),e?tl('e','-'+e,kind||'aff',wd(e)+.4,{enter:'right'}):tl('e','∅','ghost',1,{enter:'right'})],e?'with the ending: '+(e.length)+' letters':'zero expression'))});

 ending('nom. sg','Udmurt · most frequent','<span class="w">val</span> ‘horse’. The nominative singular is zero: the shortest form for the most frequent values.','val','',0,'horse'),
 ending('acc. sg','Udmurt · frequent','<span class="w">val-ez</span>. A short ending for the accusative.','val','ez'),
 ending('abl. sg','Udmurt · rarer','<span class="w">val-leś</span>. The rarer ablative is longer than the accusative.','val','leś'),
 ending('abess. sg','Udmurt · rarer','<span class="w">val-tek</span> ‘without the horse’. Another rare case, another longer ending.','val','tek'),
 ending('nom. pl','Udmurt · plural','<span class="w">val-jos</span>. The plural is overt, so it is longer than the zero singular.','val','jos'),
 ending('acc. pl','Udmurt · plural','<span class="w">val-josty</span>. Plural plus accusative: the longest so far.','val','josty'),

 pg('Tzutujil potential','Rarer mood, longer marker','<span class="w">xti-wari</span>: the potential marker xti- is longer than the completive x-.','xti-','wari','',null),

 {name:'Gothic passive',note:'The rarer passive has only three shapes.',cells:[['1sg','nimada'],['2sg','nimaza'],['3sg','nimada'],['1pl','nimanda'],['2pl','nimanda'],['3pl','nimanda']]}

function parWidget(box){
  const chips=el('div','chips'),host=el('div','stage'),res=el('div','res');box.append(chips,host,res);const st=new Stage(host);

/* ---------- Levelling ---------- */
const lev=(name,lang,desc,s1,p1,s2,p2,chS,chP)=>({name,lang,desc,
  a:S(R([tl('s',s1,'stem',wd(s1)+.4),tl('p',p1,'mod',wd(p1)+.4)],'before levelling')),
  b:S(R([tl('s',s2,chS?'ok':'stem',wd(s2)+.4),tl('p',p2,chP?'ok':'mod',wd(p2)+.4)],'after levelling: '+(chS?'the plural stem was extended to the singular':'the singular stem was extended to the plural')))});
const LEV=[
 lev('house','English · singular extended','<span class="w">[haʊs] / [haʊzəz] → [haʊs] / [haʊsəz]</span>. Some speakers level the voicing: the singular stem is extended. Nobody says [haʊz] for the singular.','haʊs','haʊzəz','haʊs','haʊsəz',0,1),
 lev('hoer','West Frisian · singular extended','<span class="w">hoer / hworren → hoer / hoeren</span> ‘whore(s)’. For a noun used mostly in the singular, the singular stem wins.','hoer','hworren','hoer','hoeren',0,1),
 lev('poel','West Frisian · singular extended','<span class="w">poel / pwollen → poel / poelen</span> ‘pool(s)’.','poel','pwollen','poel','poelen',0,1),
 lev('earm','West Frisian · plural extended','<span class="w">earm / jermen → jerm / jermen</span> ‘arm(s)’. The local frequency is reversed: arms come in pairs, so the plural stem is extended to the singular.','earm','jermen','jerm','jermen',1,0),

/* ---------- Summary ---------- */
function summaryWidget(box){
  box.append(el('ul','pts',`
   <li><b>Frequent and rare values:</b> singular > plural > dual, nominative > accusative > dative, third person > first/second, active > passive, and so on. The ultimate reason lies outside language, in what people find relevant.</li>
   <li><b>Frequency and shortness:</b> predictable values can be short, even zero (Udmurt nominative singular, third person singular).</li>
   <li><b>Frequency and differentiation:</b> frequent values show less syncretism, fewer shared exponents across inflection classes, and more cross-cutting values. Rare values are harder to remember in detail.</li>
   <li><b>Local reversals:</b> where a noun is used mostly in the plural, the singular is marked (Welsh deilen). Female nouns are derived from male ones, except where the frequency is reversed (widower, male nurse).</li>
   <li><b>Analogical levelling</b> extends the more frequent stem (house, hoer / earm). <b>Irregularity</b> clusters in frequent lexemes, because of phonological reduction and because strong memory conserves forms.</li>`));
  let tot=0,good=0;const rows=[];
  SECTIONS.forEach(s=>{let n=0,g=0;s.steps.forEach(st=>{if(st.type==='quiz')st.qs.forEach(q=>{n++;if(app.score[q.id])g++;});});
    if(n){tot+=n;good+=g;rows.push(`<li>${s.title}: <b>${g}/${n}</b></li>`);}});
  box.append(el('p','res',`<b>Quiz results (first try): ${good} of ${tot}</b><ul class="pts">${rows.join('')}</ul>`));
}
