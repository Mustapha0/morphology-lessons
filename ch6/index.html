/* ---------- Restriction explorer ---------- */
const RESTR={
 Phonological:[
  ['mesa','mesilla',1,`Spanish diminutive -illo. Fine on mesa and grupo…`],
  ['gallo','*gallillo',0,`…but not on gallo or camello: it avoids repeating the sound written ll.`],
  ['draw','drawee',1,`English patient-noun -ee works on draw and pay…`],
  ['free','*freeee',0,`…but not on free or accompany: it avoids repeating the vowel /i/.`],
  ['private','privatize',1,`English -ize likes a strong–weak rhythm: privatize, globalize.`],
  ['secure','*securize',0,`The base ends in a stressed syllable, so -ize avoids it (also *corruptize).`],
  ['black','blacken',1,`English -en takes only monosyllabic bases. There is no obvious phonetic reason: a purely arbitrary restriction.`]],
 Semantic:[
  ['König','Königin',1,`German female-noun -in: ‘king’ → ‘queen’.`],
  ['Baum','*Bäumin',0,`We do not think of trees as having gender, so the rule makes no sense here.`],
  ['colonize','decolonize',1,`English reversive de- needs a verb that denotes a reversible process.`],
  ['assassinate','*deassassinate',0,`Hard to interpret outside science fiction: an assassination is not reversible.`],
  ['bogatyj','bogatstvo',1,`Russian quality-noun -stvo takes adjectives for properties of human beings.`],
  ['vjalyj','*vjal’stvo',0,`‘Withered’ describes objects, not people. There is no intrinsic reason why -stvo should refuse it: an arbitrary semantic restriction.`]],
 Pragmatic:[
  ['Löwe','Löwin',1,`‘Lioness’: it is useful to distinguish male and female lions.`],
  ['Käfer','?Käferin',0,`‘Female beetle’ turns up on the internet, but speakers react to it much as to Bäumin. For beetles and worms, the sex distinction is simply not useful.`]],

  ['diber','dibur',1,`Modern Hebrew action nouns in CiC(C)uC, only from verbs of one inflection class (CiC(C)eC): ‘speak’ → ‘talk’.`],

function restrictWidget(box){
  const tabs=el('div','tabs'),chips=el('div','chips'),host=el('div','stage'),res=el('div','res','Choose a kind of restriction, then a case.');
  box.append(tabs,chips,host,res);const st=new Stage(host);let cur='Phonological',tm=null;const tb={};
  Object.keys(RESTR).forEach(k=>{const b=el('button','chip'+(k===cur?' on':''),k);b.onclick=()=>{cur=k;fill();};tabs.append(b);tb[k]=b;});
  function fill(){Object.keys(tb).forEach(k=>tb[k].classList.toggle('on',k===cur));chips.innerHTML='';
    RESTR[cur].forEach(([b,r,ok,note])=>{const c=el('button','chip',`${b} → ${r}`);
      c.onclick=()=>{clearTimeout(tm);[...chips.children].forEach(x=>x.classList.remove('on'));c.classList.add('on','done');
        st.set(S(R([tl('b',b,'stem',wd(b))],'base')));
        tm=setTimeout(()=>{st.set(S(R([tl('b',b,'stem',wd(b))],'base'),R([tl('r',r,ok?'ok':'bad',wd(r),{from:'b'})],ok?'possible':'blocked by the restriction')));},700);
        res.className='res '+(ok?'good':'bad');res.innerHTML=`<span class="w">${r}</span><br>${note}`;};
      chips.append(c);});
    chips.children[0].click();}

}

/* ---------- Parsing ratio vs productivity (Table 6.10) ---------- */
function parseWidget(box){
  const D=[['-ence',.1,0.0],['-ity',.17,.1],['-ate',.31,.3],['-dom',.5,.2],['-ness',.51,.8],['-ish',.58,.5],['-like',.68,38.1],['-proof',.8,5.5],['-less',.86,1.7]];
  const tabs=el('div','tabs'),list=el('div'),res=el('div','res');box.append(tabs,list,res);let v=0;
  const b0=el('button','chip on','Parsing ratio'),b1=el('button','chip','Productivity (100 × P)');tabs.append(b0,b1);
  b0.onclick=()=>{v=0;draw();};b1.onclick=()=>{v=1;draw();};
  function draw(){b0.classList.toggle('on',v===0);b1.classList.toggle('on',v===1);list.innerHTML='';
    const mx=Math.max(...D.map(d=>d[v+1]));
    D.forEach(d=>{const r=el('div','ebar');r.style.gridTemplateColumns='62px 1fr 44px';
      r.innerHTML=`<span class="bl">${d[0]}</span><div class="bt"><i class="${v?'wf':'mo'}" style="width:${Math.max(1.5,d[v+1]/mx*100)}%"></i></div><b>${d[v+1]}</b>`;list.append(r);});
    res.innerHTML=v===0?'<b>Parsing ratio</b>: the share of an affix’s words that are decomposed rather than stored. A high ratio keeps the affix itself in frequent use (strong memory strength).'
      :'<b>Productivity P (×100)</b>: from section 6.5(v). Mostly it rises with the parsing ratio (-ity and -ence are low, -less and -proof higher), but not perfectly. -like is far ahead of everything, so the bars for the rest look tiny.';}
  draw();
}

/* ---------- Lexical gang (i/u) ---------- */
function gangExamples(){
  const mk=(v,p,kind)=>{const L=T(v,'v');const i=v.indexOf('i');
    if(kind==='gang')return {name:v,lang:'In the gang: /(s)C(C)ɪŋ/ with i → u',desc:`<span class="w">${v} → ${p}</span> follows the i/u pattern, the dominant one among verbs of this shape.`,
      a:S(R(L,'present')),b:S(R(chg(L,{[i]:'u'}),'past'))};
    if(kind==='suffix')return {name:v,lang:'Outside the gang',desc:`<span class="w">${v} → ${p}</span> takes -ed. It is a possible model, but the i/u pattern is far more common among verbs of this shape (7 of 13).`,
      a:S(R(L,'present')),b:S(R([...L,tl('e','-ed','aff',1.4,{enter:'right'})],'past'))};
    if(kind==='vowel')return {name:v,lang:'Outside the gang',desc:`<span class="w">${v} → ${p}</span> uses i → a, a pattern of its own.`,a:S(R(L,'present')),b:S(R(chg(L,{[i]:'a'}),'past'))};
    return {name:v,lang:'Outside the gang',desc:`<span class="w">${v} → ${p}</span> is irregular.`,a:S(R(L,'present')),b:S(R([tl('p',p,'mod',wd(p),{from:'v0'})],'past'))};};
  return [['cling','clung','gang'],['fling','flung','gang'],['sling','slung','gang'],['string','strung','gang'],['wring','wrung','gang'],['sting','stung','gang'],['swing','swung','gang'],
    ['ding','dinged','suffix'],['sing','sang','vowel'],['bring','brought','irr']].map(x=>mk(...x));
}

/* ---------- Six measures ---------- */
function measuresWidget(box){
  const M=[
   ['(i) Type frequency','Count the actual words formed by the pattern.',S(R([tl('t','number of actual words','stem',7)],'easy to count in a dictionary')),'English -ment has hundreds of words but only four twentieth-century neologisms in the OED: not productive. -ese has few words but can be used freely.'],
   ['(ii) Possible words','Count the possible words the pattern could form.',S(R([tl('t','number of possible words','stem',7.6)],'hard: needs every restriction')),'Hard to measure. And en-/em- should fit any container noun (entomb, ensnare) yet is unproductive: *embox, *encar.'],
   ['(iii) Exhaustion','The ratio of actual to possible words.',S(R([tl('a','actual','stem',2.6),tl('b','÷','op',.6),tl('c','possible','aff',2.8)],'degree of exhaustion')),'Needs the count in (ii). For N+N compounds the set of possible words is infinite, so the ratio is tiny even though the pattern is highly productive.'],
   ['(iv) Neologisms over time','Count the neologisms attested in a period.',S(R([tl('t','neologisms per period','stem',6.4)],'diachronic productivity')),'Needs a good historical dictionary like the OED, and lexicographers overlook new words of very productive patterns. Corpora can show how -gate (Watergate, Irangate) gained and lost productivity.'],
   ['(v) P','Hapaxes with the pattern ÷ all tokens with the pattern.',S(R([tl('p','P','var',1.2),tl('e','=','op',.6),tl('n','V1,m','stem',2),tl('s','÷','op',.6),tl('d','Nm','aff',1.6)],'category-conditioned')),'A hapax legomenon occurs only once in a corpus; in a large corpus hapaxes can be assumed to be occasionalisms. P is the chance that a random word of the pattern is one.'],
   ['(vi) P*','Hapaxes with the pattern ÷ all hapaxes in the corpus.',S(R([tl('p','P*','var',1.4),tl('e','=','op',.6),tl('n','V1,m','stem',2),tl('s','÷','op',.6),tl('d','V1','aff',1.4)],'hapax-conditioned')),'It shows how much the pattern contributes to the growth of the vocabulary at a given moment, with no historical dictionary needed.']];
  const chips=el('div','chips'),host=el('div','stage'),rule=el('div','res'),note=el('p','hint');box.append(chips,host,rule,note);const st=new Stage(host);
  M.forEach(m=>{const b=el('button','chip',m[0]);b.onclick=()=>{[...chips.children].forEach(x=>x.classList.remove('on'));b.classList.add('on','done');st.set(m[2]);rule.innerHTML=`<b>${m[1]}</b>`;note.innerHTML=m[3];};chips.append(b);});

}

/* ---------- Hapax toy corpus ---------- */
function hapaxWidget(box){
  const P={'-less':{w:{childless:6,joyless:1,shoeless:1,commaless:1,careless:9}},'-ment':{w:{investment:8,harassment:5,fulfilment:4,enjoyment:7,endorsement:2}}};
  const init=JSON.stringify(P);let S0=JSON.parse(init);const OTHER=90;
  const wrap=el('div'),out=el('div','res');box.append(el('p','hint','An invented toy corpus: tap a word to add one more occurrence of it.'),wrap,out);
  function draw(){wrap.innerHTML='';let tot=OTHER;const res=[];
    Object.keys(S0).forEach(k=>{const w=S0[k].w;const ty=Object.keys(w).length,v1=Object.values(w).filter(x=>x===1).length,N=Object.values(w).reduce((a,b)=>a+b,0);S0[k].v1=v1;S0[k].N=N;S0[k].ty=ty;tot+=v1;});
    Object.keys(S0).forEach(k=>{wrap.append(el('p','gl',`${k} words`));const ch=el('div','chips');
      Object.entries(S0[k].w).forEach(([w,n])=>{const b=el('button','chip'+(n===1?' on':''),`${w} × ${n}`);b.onclick=()=>{S0[k].w[w]++;draw();};ch.append(b);});wrap.append(ch);
      const d=S0[k];res.push(`<li><b>${k}</b>: ${d.ty} types, ${d.N} tokens, <b>${d.v1}</b> hapax${d.v1===1?'':'es'} → P = ${d.v1}/${d.N} = <b>${(d.v1/d.N).toFixed(3)}</b> · P* = ${d.v1}/${tot} = <b>${(d.v1/tot).toFixed(3)}</b></li>`);});
    out.innerHTML=`Highlighted words are hapaxes (one occurrence). The rest of the corpus has ${OTHER} other hapaxes, so V1 = ${tot}.<ul class="pts">${res.join('')}</ul><small>Both patterns have the same number of types (5), yet different productivity: type frequency is not productivity.</small>`;}
  const rs=el('button','btn ghost','Reset');rs.onclick=()=>{S0=JSON.parse(init);draw();};box.append(rs);draw();
}

/* ---------- Summary ---------- */
function summaryWidget(box){
  box.append(el('ul','pts',`
   <li><b>Productivity</b> is the extent to which a rule can form new words, and it is part of speakers’ <b>competence</b>, not just performance or history.</li>
   <li>It is <b>gradient</b>, not a split between “productive” and “creative”: the less productive a rule, the more a neologism is noticed.</li>
   <li><b>Restrictions</b> on a rule’s domain can be phonological, semantic, pragmatic or morphological, or depend on a borrowed vocabulary stratum.</li>
   <li><b>Lexicon effects:</b> affixes in decomposed words gain memory strength; frequent words block synonyms; lexical gangs and patterns dense in a sound neighbourhood act as analogical models.</li>
   <li><b>Measures:</b> type frequency, possible words, exhaustion, neologisms over time, and the hapax-based <b>P</b> and <b>P*</b>.</li>`));
  let tot=0,good=0;const rows=[];
  SECTIONS.forEach(s=>{let n=0,g=0;s.steps.forEach(st=>{if(st.type==='quiz')st.qs.forEach(q=>{n++;if(app.score[q.id])g++;});});
    if(n){tot+=n;good+=g;rows.push(`<li>${s.title}: <b>${g}/${n}</b></li>`);}});
  box.append(el('p','res',`<b>Quiz results (first try): ${good} of ${tot}</b><ul class="pts">${rows.join('')}</ul>`));
}

const SECTIONS=[
{title:'What is productivity?',steps:[
 {type:'stage',cap:`A rule is <b>productive</b> to the extent that it can be applied to <b>new bases</b> to form <b>new words</b>. With a very productive rule, nobody even notices the neologism.`,
  spec:S(R([tl('a','comma','stem',2.8),tl('b','less','aff',1.8,{enter:'right'})],'commaless: “the poet writes in long, commaless sentences”'))},
 {type:'stage',cap:`Some say productivity belongs to performance, or only to language change. But every speaker agrees these hypothetical words are impossible. That suggests productivity is part of what speakers <b>know</b>.`,
  spec:S(R([tl('a','*helpnessful','bad',6.2)],'suffixes in the wrong order'),R([tl('b','*frownity','bad',4.8)],'-ity on a verb'))},
 {type:'stage',cap:`Others equate productivity with how <b>restricted</b> a rule is. But the two come apart. -ness takes almost any adjective and is productive. -en takes only monosyllabic adjectives. -let could take many nouns, yet is rarely used.`,
  spec:S(R([tl('a1','-ness','aff',1.9),tl('a2','almost any adjective','plain',4.6),tl('a3','productive','ok',3)],''),R([tl('b1','-en','aff',1.5),tl('b2','monosyllabic only','plain',4.6),tl('b3','productive','ok',3)],''),R([tl('c1','-let','aff',1.5),tl('c2','many nouns','plain',4.6),tl('c3','rarely used','bad',3)],'wide domain, yet not productive'))},

{title:'Productivity and the lexicon',steps:[
 {type:'stage',cap:`Productivity depends partly on <b>processing</b>. Patterns whose words are often decomposed keep their affix in frequent use, giving it strong <b>memory strength</b>. Relative frequency decides: modernity is rarer than modern…`,
  spec:S(R([tl('m1','modern','stem',2.8),tl('m2','-ity','aff',1.6)],'modernity: built from its parts'))},
 {type:'stage',cap:`…but security is more frequent than secure, so it is stored whole, bypassing the affix.`,
  spec:S(R([tl('s1','security','lex',4)],'security: stored whole'))},
 {type:'stage',cap:`The <b>parsing ratio</b> is the share of an affix’s words that are decomposed. For -ity it is 0.17: about 17% decomposed, 83% stored. That fits -ity not being very productive.`,
  spec:S(R([tl('d','17%','stem',1.5),tl('s','83%','lex',7.5)],'-ity words: decomposed vs stored'))},
 {type:'widget',cap:`Compare parsing ratios with productivity for nine English suffixes (Hay and Baayen’s figures).`,build:parseWidget},
 {type:'stage',cap:`<b>Synonymy blocking</b>: an existing word with the meaning pre-empts a possible new one. It does not matter whether the blocking word is related.`,
  spec:S(R([tl('a1','*to broom','bad',3.8),tl('a2','→','op',.8),tl('a3','to sweep','ok',3.2)],''),R([tl('b1','*typer','bad',3.2),tl('b2','→','op',.8),tl('b3','typist','ok',3.2)],''),R([tl('c1','*goodly','bad',3.2),tl('c2','→','op',.8),tl('c3','well','ok',2.4)],''))},
 {type:'widget',cap:`Blocking has exceptions, and <b>frequency</b> explains many. In Italian, -ità normally makes quality nouns from adjectives in -oso. Check each one.`,build:blockWidget},

  build:b=>labWidget(b,ANAEX,'Solve for X','Back')},
 {type:'widget',cap:`Why can fling/flung beat -ed? Because verbs of a similar sound shape form a <b>lexical gang</b>: seven of thirteen /(s)C(C)ɪŋ/ verbs take i/u. Try verbs in and out of the gang.`,
