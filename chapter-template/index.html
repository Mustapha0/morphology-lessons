   A stage is S(row, row, ...). A row is R(tiles, 'label', [brackets]). Reuse ids between steps to animate. */

const Q={
  q1:{id:'q1',q:'Example question?',o:['Right answer','Wrong','Wrong','Wrong'],a:0,w:'Explanation shown after answering.'}
};

 {title:'First section',steps:[

  {type:'quiz',cap:'Check yourself.',qs:[Q.q1]}
 ]}
