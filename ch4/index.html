const {el,seg,T,tl,R,S,chg,mark,strip,shuffle,Stage,app,quizWidget,labWidget,sort3Widget}=Lesson;
/* Storage economy: Greek nouns */
function econWidget(box){
  const L=['fíl-','kósm-','fóv-','gám-','skíl-'],NM=['filos','kosmos','fovos','gamos','skilos'];
  const SUF=['-os','-o','-u','-i','-us','-on'];let n=1;
  const t=el('table','tb');
  t.innerHTML='<tr><th>filos ‘friend’</th><th>singular</th><th>plural</th></tr><tr><td>nominative</td><td>fílos</td><td>fíli</td></tr><tr><td>accusative</td><td>fílo</td><td>fílus</td></tr><tr><td>genitive</td><td>fílu</td><td>fílon</td></tr>';
  const chips=el('div','chips'),b1=el('button','chip','+ add a noun like it'),b0=el('button','chip','Reset');chips.append(b1,b0);
  const bars=el('div');
  const mk=(lab,cls)=>{const r=el('div','ebar');r.innerHTML=`<span class="bl">${lab}</span><div class="bt"><i class="${cls}"></i></div><b>0</b>`;return r;};
  const rw=mk('Word-form lexicon','wf'),rm=mk('Morpheme lexicon','mo');bars.append(rw,rm);
  const info=el('div','res');
  box.append(t,chips,bars,info);
  function draw(){
    const w=6*n,m=n+6;
    rw.querySelector('i').style.width=(w/30*100)+'%';rm.querySelector('i').style.width=(m/30*100)+'%';
    rw.querySelector('b').textContent=w;rm.querySelector('b').textContent=m;
    info.className='res '+(m<w?'good':'');
    info.innerHTML=`<b>${n}</b> noun${n>1?'s':''}: ${NM.slice(0,n).join(', ')}.<br>Morphemes stored: ${L.slice(0,n).join(' ')} · ${SUF.join(' ')}<br>`+
      (n===1?'With one noun, listing the six word-forms (6) is even cheaper than storing seven morphemes (7).':
       n<5?'The six suffixes are shared, so each new noun adds one stem instead of six forms.':
       'Five nouns: 30 word-forms against 11 morphemes. Multiply by thousands of nouns and verbs and the morpheme lexicon looks far more economical.');
    b1.disabled=n>=5;
  }
  b1.onclick=()=>{if(n<5){n++;draw();}};b0.onclick=()=>{n=1;draw();};draw();
}

/* -al: stored or built? */
function alWidget(box){
  const D=[['arrive','arrival',1],['refuse','refusal',1],['deny','denial',1],['revive','revival',1],['betray','betrayal',1],['bestow','bestowal',1],
    ['repair','*repairal',0],['ignore','*ignoral',0],['amuse','*amusal',0],['debug','*debuggal',0]];
  const host=el('div','stage'),chips=el('div','chips'),res=el('div','res','Tap a verb and try adding -al.');
  box.append(chips,host,res);const st=new Stage(host);let tm=null;
  D.forEach(([v,w,ok])=>{const c=el('button','chip',v);
    c.onclick=()=>{clearTimeout(tm);[...chips.children].forEach(x=>x.classList.remove('on'));c.classList.add('on','done');
      const vt=tl('v',v,'stem',v.length*.55+.7),at=tl('a','-al','aff',1.6,{enter:'right'});
      st.set(S(R([vt,at],'try the suffix')));
      tm=setTimeout(()=>{
        if(ok){st.set(S(R([tl('w',w,'lex',w.length*.6+.8,{from:'v'})],'a stored noun')));
          res.className='res good';res.innerHTML=`<span class="w">${w}</span> exists, but nothing in the verb predicts it. It sits in the lexicon next to ${v}.`;}
        else{st.set(S(R([tl('w',w,'bad',w.length*.6+.8,{from:'v'})],'not a word')));
          res.className='res bad';res.innerHTML=`<span class="w">${w}</span> is not English. The list of -al nouns is closed (35 according to the OED), so -al cannot make new ones.`;}
      },900);};
    chips.append(c);});
}

/* Dual-route race (a toy built on Table 4.3) */
function raceWidget(box){
  const S0={f:'word',s:'seg',a:'none'};
  const ROWS=[
    ['f','Token frequency',[['word','Word more frequent than its base'],['base','Base more frequent than the word']]],
    ['s','Segmentability',[['seg','Easy to segment'],['less','Hard to segment']]],
    ['a','Allomorphy in the base',[['none','Affix leaves base unchanged'],['change','Affix changes the base']]]];
  const ctl=el('div');const bt={};
  ROWS.forEach(([k,lab,opts])=>{ctl.append(el('p','gl',lab));const ch=el('div','chips');
    opts.forEach(([v,t])=>{const b=el('button','chip'+(S0[k]===v?' on':''),t);b.onclick=()=>{S0[k]=v;sync();};ch.append(b);bt[k+v]=b;});ctl.append(ch);});
  const mkLane=(name,txt)=>{const l=el('div','lane');l.innerHTML=`<div class="gl">${name}</div><div class="track"><div class="runner">${txt}</div><div class="finish"></div></div>`;return l;};
  const ld=mkLane('Direct route','insane'),lc=mkLane('Decomposition route','in + sane');
  const go=el('button','btn','Run the race'),res=el('div','res','Set the three factors, then run the race.'),
    note=el('p','hint','A toy model: the book gives the three factors and which way each pushes (Table 4.3), but no formula. Here each factor simply counts as one vote.');
  box.append(ctl,ld,lc,go,res,note);
  function sync(){ROWS.forEach(([k,,opts])=>opts.forEach(([v])=>bt[k+v].classList.toggle('on',S0[k]===v)));}
  let tm=null;
  function run(){
    clearTimeout(tm);
    const dp=(S0.f==='word')+(S0.s==='less')+(S0.a==='change');
    const dd=3.4-0.9*dp,dc=3.4-0.9*(3-dp);
    [ld,lc].forEach(l=>{l.classList.remove('win');const r=l.querySelector('.runner');r.style.transition='none';r.style.left='0px';r.getBoundingClientRect();});
    [[ld,dd],[lc,dc]].forEach(([l,d])=>{const r=l.querySelector('.runner'),tr=l.querySelector('.track');
      r.style.transition=`left ${d}s linear`;r.style.left=(tr.clientWidth-r.offsetWidth-10)+'px';});
    res.className='res';res.textContent='…';
    const win=dp>=2?'direct':'decomp';
    tm=setTimeout(()=>{(win==='direct'?ld:lc).classList.add('win');
      res.className='res good';
      res.innerHTML=win==='direct'?`<b>Direct route wins</b> (${dp} of 3 factors favour whole-word storage). The listener looks up the word as one item.`
        :`<b>Decomposition wins</b> (${dp} of 3 factors favour whole-word storage). The listener looks up the parts.`;},Math.min(dd,dc)*1000+150);
  }
  go.onclick=run;
}

/* Mini experiment: relatedness judgements */
function expWidget(box){
  const F=[['helpful','help'],['awful','awe'],['artful','art']];
  const TI=[['obscurity','obscure','infrequent'],['acidity','acid','infrequent'],['modernity','modern','infrequent'],
    ['opportunity','opportune','frequent'],['priority','prior','frequent'],['security','secure','frequent']];
  const deck=[...F.map(([a,b])=>({a,b,g:'filler'})),...shuffle(TI.map(([a,b,g])=>({a,b,g})))];
  let i=0;const rate=[];const wrap=el('div');box.append(wrap);
  function draw(){
    wrap.innerHTML='';
    if(i>=deck.length){
      const m=g=>{const v=deck.map((d,j)=>d.g===g?rate[j]:null).filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length;};
      const mi=m('infrequent'),mf=m('frequent');
      const dir=mf<mi?'in the direction the chapter’s hypothesis predicts (frequent complex words stored whole, so judged less related to their bases)':
        mf>mi?'opposite to the direction the chapter’s hypothesis predicts':'a tie, so no relationship in this tiny sample';
      wrap.append(el('p','res good',`<b>Your ratings</b> (1 = unrelated, 7 = very related)<ul class="pts"><li>Infrequent words: <b>${mi.toFixed(1)}</b></li><li>Frequent words: <b>${mf.toFixed(1)}</b></li></ul>Your result is ${dir}.`),
        el('p','hint','One person and six items prove nothing. Step 5 of the exercise asks the right follow-ups: did speakers agree, did every word in a group behave alike, and does a rating of semantic closeness really measure how a word is stored? Hay’s alternative is to compare each word with its own base, not just count how often it is used.'));
      const b=el('button','btn ghost','Run it again');b.onclick=()=>{location.hash='';i=0;rate.length=0;draw();};wrap.append(b);return;}
    const d=deck[i];
    wrap.append(el('p','qn',`Card ${i+1} of ${deck.length}`),
      el('p','qq',`How related is the meaning of <span style="font-family:var(--serif);font-size:21px">${d.a}</span> to <span style="font-family:var(--serif);font-size:21px">${d.b}</span>?`));
    const row=el('div','chips');
    for(let k=1;k<=7;k++){const c=el('button','chip',String(k));c.onclick=()=>{rate[i]=k;i++;draw();};row.append(c);}
    wrap.append(row,el('p','hint','1 = not at all related, 7 = very related'));
  }
  draw();
}

/* Summary */
function summaryWidget(box){
  box.append(el('ul','pts',`
   <li><b>The question:</b> do speakers store morphemes, whole word-forms, or both?</li>
   <li><b>Morpheme lexicon:</b> economical, but meaning is often non-compositional, and base modification, cumulative expression, zero expression and empty morphs resist segmentation.</li>
   <li><b>Strict word-form lexicon:</b> explains unproductive patterns and frequency effects, but morphemes seem real to speakers, and Turkish-sized paradigms are a challenge.</li>
   <li><b>Moderate word-form lexicon:</b> word-forms, morphemes and derived stems are all stored. Lexical access is a race between the direct and decomposition routes.</li>
   <li><b>Factors:</b> a complex word is more likely stored whole when it is frequent, hard to segment, or changes its base.</li>`));
  let tot=0,good=0;const rows=[];
  SECTIONS.forEach(s=>{let n=0,g=0;s.steps.forEach(st=>{if(st.type==='quiz')st.qs.forEach(q=>{n++;if(app.score[q.id])g++;});});
    if(n){tot+=n;good+=g;rows.push(`<li>${s.title}: <b>${g}/${n}</b></li>`);}});
  box.append(el('p','res',`<b>Quiz results (first try): ${good} of ${tot}</b><ul class="pts">${rows.join('')}</ul>`));
}

 d1:{id:'d1',q:'Insane occurs about 14 times per million words and sane about 8. Which route is favoured for insane?',
  o:['The direct route: the complex word is more frequent than its base','Decomposition: the base is more frequent','Neither: frequency is irrelevant','Both always tie'],a:0,w:'Higher token frequency means greater memory strength, so the whole word wins the race.'},
 d2:{id:'d2',q:'Why is electricity more likely stored whole than ambassadorship?',
  o:['-ity changes the base (electric → electricity); -ship leaves it intact','-ity is a prefix','Ambassadorship is more frequent','-ship is unproductive'],a:0,w:'Affixes that induce allomorphy in the base are less likely to be decomposed.'},
 d3:{id:'d3',q:'Insanely is probably stored as…',o:['insane + -ly (two entries)','in- + sane + -ly (three entries)','one whole word only','not stored at all'],a:0,
