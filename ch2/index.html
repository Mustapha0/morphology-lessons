<script>
const {el,seg,T,tl,R,S,chg,mark,strip,shuffle,Stage,app,quizWidget,labWidget,sort3Widget}=Lesson;
const W=t=>Math.max(1,t.length*0.5+0.4);
const tw=(id,t,k='stem',x={})=>tl(id,t,k,W(t),x);
const L=(s,p,k='stem')=>Array.from(s).map((c,i)=>tl(p+i,c,k,1));

/* Object row + gloss row, columns aligned. list = [[object, gloss, kind], ...] */
function glossRows(list){
  const a=[],b=[];
  list.forEach(([o,g,k],i)=>{const w=Math.max(W(o),W(g)*0.9);
    a.push(tl('o'+i,o,k||'stem',w));b.push(tl('g'+i,g,'plain',w,{enter:'bottom'}));});
  return {a,b};
}

/* ---------- Widget: paradigm tables (Greek filos, Latin insula) ---------- */
function paradigmWidget(box){
  const P=[
   {n:'Greek filos ‘friend’',rows:[['nominative','fílos','fíli'],['accusative','fílo','fílus'],['genitive','fílu','fílon']]},
   {n:'Latin insula ‘island’',rows:[['nominative','insula','insulae'],['accusative','insulam','insulās'],['genitive','insulae','insulārum'],['dative','insulae','insulīs'],['ablative','insulā','insulīs']]}];
  const tabs=el('div','tabs'),holder=el('div'),res=el('div','res');
  box.append(tabs,holder,res);
  const tbs=P.map((p,i)=>{const c=el('button','chip',p.n);c.onclick=()=>draw(i);tabs.append(c);return c;});
  function draw(i){
    tbs.forEach((c,j)=>c.classList.toggle('on',j===i));
    const p=P[i];holder.innerHTML='';
    const t=el('table','tb');t.innerHTML='<tr><th></th><th>singular</th><th>plural</th></tr>';
    const cells=[];
    p.rows.forEach(r=>{const tr=el('tr');tr.append(el('td','',`<small>${r[0]}</small>`));
      [1,2].forEach(k=>{const td=el('td','',r[k]);td.style.cursor='pointer';td.dataset.f=r[k];td.dataset.fn=r[0]+(k===1?' singular':' plural');
        td.onclick=()=>pick(td);cells.push(td);tr.append(td);});t.append(tr);});
    holder.append(t);
    const n=cells.length,d=new Set(cells.map(c=>c.dataset.f)).size;
    function pick(td){
      cells.forEach(c=>{c.style.background=(c.dataset.f===td.dataset.f)?'color-mix(in srgb,var(--var) 22%,transparent)':'';});
      const same=cells.filter(c=>c.dataset.f===td.dataset.f);
      res.innerHTML=same.length>1
        ?`<b>${td.dataset.f}</b> fills ${same.length} cells: ${same.map(c=>c.dataset.fn).join(' and ')}. Same sounds, different grammatical functions, so these are different word-forms.`
        :`<b>${td.dataset.f}</b> expresses just one set of functions: ${td.dataset.fn}.`;
    }
    res.innerHTML=`This paradigm has <b>${n}</b> sets of grammatical functions, so <b>${n} word-forms</b>, but only <b>${d}</b> different sound sequences. Tap a form.`;
  }
  draw(1);
}

/* ---------- Widget: how to read a gloss ---------- */
function glossRulesWidget(box){
  const ul=el('ul','pts');
  [['1','<b>One-to-one.</b> Each element of the example is translated by one element of the gloss. Hyphens separate morphemes in both lines, and the two lines are aligned at the left.'],
   ['2','<b>Value labels.</b> Grammatical elements are not translated but replaced by abbreviated labels (nom, acc, pst, pl…), usually in small capitals.'],
   ['3','<b>Periods</b> join several gloss elements that match one element of the example: a multi-word translation (come.out), several meanings in one affix (gen.pl), or a meaning that cannot be segmented (fig.pl).'],
   ['3b','<b>Person and number</b> go together as 1sg, with no period, because they combine so often.'],
   ['4','<b>Simplifying.</b> When the morpheme division does not matter, periods can be used throughout: bloom.caus.pst. In running text, put the gloss in [square brackets].']]
  .forEach(([a,b])=>ul.append(el('li','',`<span class="pill">${a}</span>${b}`)));
  box.append(ul);
}

 al1:{id:'al1',q:'English plural [s], [z] and [əz] are…',o:['Three different morphemes','Allomorphs of one plural morpheme','Roots','Suppletive allomorphs'],a:1,

 al2:{id:'al2',q:'go → wen-t is an example of…',o:['Phonological allomorphy','Strong suppletion','Weak suppletion','No allomorphy'],a:1,w:'The stem shapes share no form at all.'},
 al3:{id:'al3',q:'In the surface form [taːk] ‘day’, the final k comes from underlying g because…',
  o:['A rule makes voiced obstruents voiceless in syllable-final position','German has no g','The plural is different','Suppletion'],a:0,

  w:'The choice depends on properties of the individual base word, here its meaning.'},
 gl1:{id:'gl1',q:'In insul-ārum island-gen.pl, why is gen.pl joined by a period?',
  o:['One morpheme expresses two meanings at once','It is a mistake','Latin has no hyphen','It marks a prefix'],a:0,w:'-ārum expresses genitive and plural together, and they cannot be segmented.'},
 gl2:{id:'gl2',q:'Why is it written 1sg and not 1.sg?',o:['Person and number combine so often that the period is felt to be redundant','1 is not a number','Because it is a suffix','It is a typo'],a:0,
  w:'This is the convention stated in the Appendix to Chapter 2.'},
 gl3:{id:'gl3',q:'Albanian fik → fiq is glossed fig.sg → fig.pl. The period is there because…',
  o:['The number is expressed in a way that cannot be segmented','Albanian has no plural','fik is a suffix','Hyphens are banned'],a:0,w:'There is no separate piece to which pl can be assigned, so the two meanings are joined by a period.'}
};

/* ---------- Lesson ---------- */
const SECTIONS=[

 ]},

   spec:S(R([tw('t0','the','plain'),tw('t1','dog','plain'),tw('t2','saw','plain'),tw('t3','the','plain'),tw('t4','dogs','plain')],'5 word tokens'))},

  {type:'stage',cap:'Linguists often picture <b>one underlying form</b> that rules reshape. German: a voiced obstruent becomes voiceless in syllable-final position. Underlying <b>[taːg]</b> ‘day’.',
